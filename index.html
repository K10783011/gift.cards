<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧商品卡管理系統</title>
    <!-- 引入 Tailwind CSS 進行快速美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 QuaggaJS 處理相機條碼掃描 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <!-- 引入 Tesseract.js 處理圖片文字辨識 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        /* 確保 QuaggaJS 內部視訊容器完美滿版，消除黑畫面 */
        #interactive.viewport video, #interactive.viewport canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- 標題 -->
        <header class="bg-white shadow rounded-lg p-6 text-center">
            <h1 class="text-2xl font-bold text-gray-800">💳 智慧商品卡管理系統</h1>
            <p class="text-sm text-gray-500 mt-1">支援相機掃描、批次圖片匯入、金額辨識與快速出示結帳</p>
        </header>

        <!-- 操作面板 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 功能 1: 相機即時掃描 -->
            <div class="bg-white shadow rounded-lg p-6 flex flex-col items-center">
                <h2 class="text-lg font-semibold text-gray-700 mb-3">📷 相機掃描條碼</h2>
                <div id="interactive" class="viewport w-full h-48 bg-black rounded relative overflow-hidden flex items-center justify-center">
                    <span class="text-white text-sm absolute z-10">相機未啟動</span>
                </div>
                <div class="mt-4 flex gap-2 w-full">
                    <button onclick="startScanner()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded transition">啟動相機</button>
                    <button onclick="stopScanner()" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded transition">關閉相機</button>
                </div>
            </div>

            <!-- 功能 2 & 3: 圖片批次匯入與自動金額辨識 -->
            <div class="bg-white shadow rounded-lg p-6 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">📂 圖片批次匯入與辨識</h2>
                    <p class="text-xs text-gray-500 mb-3">上傳商品卡照片，系統將自動解析文字並嘗試抓取金額與條碼特徵。</p>
                    <input type="file" id="batchFiles" multiple accept="image/*" class="block w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-violet-50 file:text-violet-700
                        hover:file:bg-violet-100 cursor-pointer"/>
                </div>
                <button onclick="processBatchImages()" class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded transition">
                    開始批次辨識匯入
                </button>
                <div id="loadingStatus" class="text-center text-sm text-violet-600 font-medium mt-2"></div>
            </div>

        </div>

        <!-- 手動新增/修改卡片表單 -->
        <div class="bg-white shadow rounded-lg p-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-3">✏️ 手動新增 / 編輯卡片</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <input type="text" id="cardName" placeholder="商品卡名稱 (例如: 7-11 禮券)" class="border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="cardBarcode" placeholder="條碼編號" class="border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="number" id="cardAmount" placeholder="金額 (NT$)" class="border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <!-- 快速金額選擇列 (若辨識不出時可快速選取) -->
            <div class="mt-3 flex items-center gap-2 flex-wrap text-sm">
                <span class="text-gray-500 text-xs">快速指定金額：</span>
                <button onclick="setQuickAmount(35)" class="bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded text-xs border">35元</button>
                <button onclick="setQuickAmount(50)" class="bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded text-xs border">50元</button>
                <button onclick="setQuickAmount(100)" class="bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded text-xs border">100元</button>
                <button onclick="setQuickAmount('')" class="text-gray-400 hover:text-gray-600 text-xs underline ml-auto">清除金額</button>
            </div>

            <button onclick="saveCard()" class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-6 rounded transition text-sm">儲存卡片</button>
        </div>

        <!-- 商品卡清單 -->
        <div class="bg-white shadow rounded-lg p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-700">📋 現有商品卡列表</h2>
                <button onclick="clearAllCards()" class="text-xs text-red-500 hover:underline">清空所有資料</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-3 border-b">名稱</th>
                            <th class="p-3 border-b">條碼 / 特徵</th>
                            <th class="p-3 border-b">餘額 / 狀態</th>
                            <th class="p-3 border-b text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="cardTableBody" class="text-sm text-gray-700">
                        <!-- 動態帶入 -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- 條碼出示 Modal 彈跳視窗 -->
    <div id="barcodeModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full text-center space-y-4 shadow-xl">
            <h3 id="modalCardTitle" class="text-lg font-bold text-gray-800">商品卡條碼</h3>
            <div class="bg-gray-50 border p-4 rounded flex flex-col items-center justify-center space-y-2">
                <!-- 模擬條碼圖示呈現 (條紋樣式與文字) -->
                <div id="modalBarcodeDisplay" class="font-mono tracking-widest text-2xl font-black bg-white px-4 py-3 border rounded w-full text-gray-900 shadow-inner">
                    123456789
                </div>
                <p class="text-xs text-gray-500">請將此條碼出示給店員掃描</p>
            </div>
            <div class="flex gap-2">
                <button onclick="deductCardAmount()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-2 rounded text-sm transition">扣款 / 使用結帳</button>
                <button onclick="closeBarcodeModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 py-2 rounded text-sm transition">關閉</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯實作 -->
    <script>
        let cards = JSON.parse(localStorage.getItem('gift_cards')) || [];
        let currentActiveIndex = null; // 目前打開 Modal 的卡片索引

        // 初始化渲染
        window.onload = function() {
            renderTable();
        };

        // 儲存資料到 LocalStorage
        function saveData() {
            localStorage.setItem('gift_cards', JSON.stringify(cards));
            renderTable();
        }

        // 快速指定金額
        function setQuickAmount(val) {
            document.getElementById('cardAmount').value = val;
        }

        // 渲染表格
        function renderTable() {
            const tbody = document.getElementById('cardTableBody');
            tbody.innerHTML = '';
            
            if (cards.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">目前沒有儲存的商品卡</td></tr>`;
                return;
            }

            cards.forEach((card, index) => {
                const amount = card.amount !== undefined ? card.amount : 0;
                const isDepleted = amount <= 0;

                // 根據狀態套用樣式：如果餘額 <= 0 則呈現灰階、半透明
                const rowClass = isDepleted 
                    ? "bg-gray-200 opacity-60 text-gray-500 border-b" 
                    : "hover:bg-gray-50 border-b";

                tbody.innerHTML += `
                    <tr class="${rowClass}">
                        <td class="p-3">
                            ${card.name || '未命名商品卡'}
                            ${isDepleted ? '<span class="ml-2 text-xs bg-gray-400 text-white px-1.5 py-0.5 rounded">使用完畢</span>' : ''}
                        </td>
                        <td class="p-3 font-mono text-xs">${card.barcode}</td>
                        <td class="p-3 font-semibold ${isDepleted ? 'text-gray-500' : 'text-green-600'}">
                            NT$ ${amount}
                        </td>
                        <td class="p-3 text-center space-x-1">
                            <button onclick="showBarcode(${index})" class="text-blue-600 hover:text-blue-800 text-xs bg-blue-50 px-2 py-1 rounded transition">出示條碼</button>
                            <button onclick="deleteCard(${index})" class="text-red-500 hover:text-red-700 text-xs bg-red-50 px-2 py-1 rounded transition">刪除</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 手動新增卡片
        function saveCard() {
            const name = document.getElementById('cardName').value.trim();
            const barcode = document.getElementById('cardBarcode').value.trim();
            const amountInput = document.getElementById('cardAmount').value.trim();

            if (!barcode) {
                alert('請至少填寫條碼編號！');
                return;
            }

            // 若金額未填，提供 35 / 50 / 100 / 手動輸入的提示或預設為 0
            const amount = amountInput === '' ? 0 : Number(amountInput);

            cards.push({ name, barcode, amount });
            saveData();

            // 清空輸入框
            document.getElementById('cardName').value = '';
            document.getElementById('cardBarcode').value = '';
            document.getElementById('cardAmount').value = '';
        }

        // 刪除單張卡片
        function deleteCard(index) {
            cards.splice(index, 1);
            saveData();
        }

        // 清空全部
        function clearAllCards() {
            if (confirm('確定要清空所有商品卡資料嗎？')) {
                cards = [];
                saveData();
            }
        }

        // --- 彈跳出示條碼與扣款機制 ---
        function showBarcode(index) {
            currentActiveIndex = index;
            const card = cards[index];
            document.getElementById('modalCardTitle').innerText = card.name || '商品卡條碼';
            document.getElementById('modalBarcodeDisplay').innerText = card.barcode;
            document.getElementById('barcodeModal').classList.remove('hidden');
        }

        function closeBarcodeModal() {
            document.getElementById('barcodeModal').classList.add('hidden');
            currentActiveIndex = null;
        }

        function deductCardAmount() {
            if (currentActiveIndex === null) return;
            const card = cards[currentActiveIndex];
            
            if (card.amount <= 0) {
                alert('此商品卡餘額已歸零！');
                return;
            }

            let deductVal = prompt(`目前餘額為 NT$ ${card.amount}，請輸入本次扣款金額 (或輸入整張扣除)：`, card.amount);
            if (deductVal === null) return; // 取消

            let amountToDeduct = Number(deductVal);
            if (isNaN(amountToDeduct) || amountToDeduct <= 0) {
                alert('請輸入有效的金額數字！');
                return;
            }

            card.amount = Math.max(0, card.amount - amountToDeduct);
            saveData();
            showBarcode(currentActiveIndex); // 重新整理 Modal 畫面內容
            if (card.amount === 0) {
                alert('扣款成功，此商品卡已全數使用完畢！');
            } else {
                alert(`扣款成功！剩餘金額：NT$ ${card.amount}`);
            }
        }

        // --- 1. QuaggaJS 相機條碼掃描 ---
        function startScanner() {
            const container = document.querySelector('#interactive');
            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: container,
                    constraints: {
                        facingMode: "environment" // 使用後置鏡頭
                    }
                },
                decoder: {
                    readers: ["code_128_reader", "ean_reader", "ean_8_reader", "upc_reader", "code_39_reader"]
                }
            }, function(err) {
                if (err) {
                    console.error(err);
                    alert("無法啟動相機，請檢查瀏覽器權限或是否使用 HTTPS/Localhost。");
                    return;
                }
                Quagga.start();
            });

            Quagga.onDetected(function(result) {
                const code = result.codeResult.code;
                document.getElementById('cardBarcode').value = code;
                alert(`成功掃描到條碼: ${code}`);
                stopScanner();
            });
        }

        function stopScanner() {
            try {
                Quagga.stop();
            } catch (e) {
                // 忽略未啟動時停止的錯誤
            }
        }

        // --- 2 & 3. 圖片批次匯入與自動金額辨識 (Tesseract.js) ---
        async function processBatchImages() {
            const fileInput = document.getElementById('batchFiles');
            const statusDiv = document.getElementById('loadingStatus');

            if (fileInput.files.length === 0) {
                alert('請先選擇至少一張商品卡圖片！');
                return;
            }

            const files = fileInput.files;
            statusDiv.innerText = `準備辨識共 ${files.length} 張圖片...`;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusDiv.innerText = `正在辨識第 ${i + 1} / ${files.length} 張圖片...`;

                try {
                    const result = await Tesseract.recognize(
                        file,
                        'eng+chi_tra', // 支援英文與繁體中文
                        { logger: m => console.log(m) }
                    );

                    const text = result.data.text;
                    const amount = extractAmount(text);
                    
                    const cardName = file.name.substring(0, file.name.lastIndexOf('.')) || '匯入商品卡';
                    const barcode = `IMG-${Date.now().toString().slice(-6)}-${i}`;

                    cards.push({
                        name: cardName,
                        barcode: barcode,
                        amount: amount // 若無法辨識會回傳 0，使用者後續可手動修改或點選
                    });

                } catch (error) {
                    console.error(error);
                }
            }

            saveData();
            statusDiv.innerText = '批次辨識與匯入完成！';
            fileInput.value = '';
            setTimeout(() => { statusDiv.innerText = ''; }, 3000);
        }

        // 自動辨識金額核心運算法則 (Regular Expression)
        function extractAmount(text) {
            const patterns = [
                /(?:\$|NT\$|NT)\s*([0-9,]+)/i,
                /([0-9,]+)\s*(?:元|塊)/
            ];

            for (let pattern of patterns) {
                const match = text.match(pattern);
                if (match && match[1]) {
                    const cleanNum = Number(match[1].replace(/,/g, ''));
                    if (!isNaN(cleanNum) && cleanNum > 0 && cleanNum < 100000) {
                        return cleanNum;
                    }
                }
            }

            const numbers = text.match(/\b\d{2,5}\b/g);
            if (numbers && numbers.length > 0) {
                return Number(numbers[0]);
            }

            return 0; // 若無法辨識金額，預設回傳 0（使用者可於列表中或手動表單調整）
        }
    </script>
</body>
</html>

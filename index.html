<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品卡管理系統</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入 JsBarcode 用於產生條碼圖示 -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- 引入 ZXing 掃描庫用於相機與相簿圖片解條碼 -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card-summary { border-left: 5px solid #0d6efd; }
        #videoContainer { max-width: 100%; max-height: 320px; display: none; position: relative; background: #000; border-radius: 8px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 扁平寬矩形對焦框 */
        .scanner-frame {
            position: absolute;
            top: 38%;
            bottom: 38%;
            left: 8%;
            right: 8%;
            border: 2px solid #0d6efd;
            background-color: rgba(13, 110, 253, 0.08);
            border-radius: 4px;
            box-sizing: border-box;
            z-index: 4;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.4);
        }
        
        .barcode-box { background: #fff; padding: 15px; border-radius: 8px; display: inline-block; max-width: 100%; overflow-x: auto; }
        
        /* 灰階完結卡片樣式 */
        .card-depleted {
            filter: grayscale(100%);
            opacity: 0.55;
            background-color: #e9ecef !important;
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
            <h1 class="h4 fw-bold text-primary mb-0"><i class="bi bi-wallet2"></i> 商品卡管理系統</h1>
            <div class="d-flex gap-2">
                <!-- 批量上傳相簿按鈕 -->
                <label class="btn btn-outline-primary btn-sm mb-0" style="cursor: pointer;">
                    <i class="bi bi-images"></i> 相簿批量新增
                    <input type="file" id="batchImageInput" accept="image/*" multiple style="display: none;" onchange="handleBatchImages(event)">
                </label>
                <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#cardModal" onclick="openAddModal()">
                    <i class="bi bi-plus-circle"></i> 新增商品卡
                </button>
            </div>
        </header>

        <!-- 數據總覽看板 -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm card-summary">
                    <div class="card-body py-3">
                        <h6 class="text-muted small mb-1">初始總面額</h6>
                        <h4 class="fw-bold mb-0" id="totalInitial">$0</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm" style="border-left: 5px solid #198754;">
                    <div class="card-body py-3">
                        <h6 class="text-muted small mb-1">目前剩餘總額</h6>
                        <h4 class="fw-bold text-success mb-0" id="totalRemaining">$0</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm" style="border-left: 5px solid #ffc107;">
                    <div class="card-body py-3">
                        <h6 class="text-muted small mb-1">已使用金額</h6>
                        <h4 class="fw-bold text-secondary mb-0" id="totalUsed">$0</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- 卡片列表區 -->
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold fs-6">我的商品卡清單</h5>
                <div>
                    <select id="filterStore" class="form-select form-select-sm" onchange="renderCards()">
                        <option value="">全部超商</option>
                        <option value="7-11">7-11</option>
                        <option value="全家">全家</option>
                        <option value="萊爾富">萊爾富</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-center">
                        <thead class="table-light">
                            <tr>
                                <th>超商</th>
                                <th>卡片名稱 / 條碼</th>
                                <th>原始面額</th>
                                <th>剩餘金額</th>
                                <th>有效期限</th>
                                <th>狀態</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="cardTableBody">
                            <!-- 動態渲染資料 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增/編輯 Modal -->
    <div class="modal fade" id="cardModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="cardForm" onsubmit="saveCard(event)">
                    <div class="modal-header">
                        <h5 class="modal-title fs-5" id="modalTitle">新增商品卡</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="stopScanner()"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="cardId">
                        
                        <!-- 高解析度相機與一維條碼圖框掃描區塊 -->
                        <div class="mb-3 p-3 bg-light rounded border text-center">
                            <button type="button" class="btn btn-outline-dark btn-sm mb-2" onclick="startScanner()">
                                <i class="bi bi-camera-fill"></i> 開啟高畫質相機掃描
                            </button>
                            <div id="videoContainer" class="mt-2">
                                <video id="interactive" muted playsinline></video>
                                <div class="scanner-frame"></div>
                            </div>
                            <div id="scannerTip" class="text-muted small mt-1" style="display: none;">
                                請將條碼置於藍色長框內... (<a href="#" onclick="stopScanner(); return false;" class="text-danger">關閉相機</a>)
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">超商平台</label>
                            <select class="form-select" id="storeName" required>
                                <option value="7-11">7-11 統一超商</option>
                                <option value="全家">全家便利商店</option>
                                <option value="萊爾富">萊爾富</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">卡片名稱 / 辨識備註</label>
                            <input type="text" class="form-control" id="cardTitleName" placeholder="例如：711禮券" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">條碼數字編號 (供結帳出示)</label>
                            <input type="text" class="form-control font-monospace" id="barcodeNumber" placeholder="例如：1234567890123" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">原始面額 (NT$)</label>
                                <input type="number" class="form-control" id="initialAmount" min="0" required oninput="syncRemaining(this)">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">剩餘金額 (NT$)</label>
                                <input type="number" class="form-control" id="remainingAmount" min="0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">有效期限 (選填)</label>
                            <input type="date" class="form-control" id="expiryDate">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" onclick="stopScanner()">取消</button>
                        <button type="submit" class="btn btn-primary btn-sm">儲存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 顯示付款條碼 Modal -->
    <div class="modal fade" id="barcodeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-header">
                    <h5 class="modal-title fs-5" id="barcodeModalTitle">出示條碼付款</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-4">
                    <h5 id="barcodeCardInfo" class="text-primary mb-3"></h5>
                    <div class="barcode-box border shadow-sm mb-2">
                        <svg id="barcodeSvg"></svg>
                    </div>
                    <p id="barcodeTextDisplay" class="font-monospace text-muted mt-1 mb-0 fw-bold" style="font-size: 1.1rem;"></p>
                    <hr class="my-3">
                    <!-- 快速扣款區 -->
                    <div class="text-start px-2">
                        <label class="form-label fw-bold small">店員刷完後，自動計算扣款：</label>
                        <div class="input-group mb-2">
                            <span class="input-group-text">$</span>
                            <input type="number" id="quickDeductAmount" class="form-control" placeholder="輸入本次消費金額" oninput="previewAutoCalc(this)">
                        </div>
                        <!-- 即時計算預覽提示 -->
                        <div id="calcPreviewBox" class="alert alert-info py-2 mb-3 small" style="display: none;">
                            扣款後預估剩餘：<strong id="previewRemaining" class="text-success">$0</strong>
                        </div>
                        <button class="btn btn-success w-100" type="button" onclick="confirmDeduct()">確認扣款並更新餘額</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let cards = JSON.parse(localStorage.getItem('convenience_store_cards_v3')) || [];
        const cardModal = new bootstrap.Modal(document.getElementById('cardModal'));
        const barcodeModal = new bootstrap.Modal(document.getElementById('barcodeModal'));
        let codeReader = null;
        let currentDeductingId = null;

        function getStoreBadge(storeName) {
            switch(storeName) {
                case '7-11': return '<span class="badge bg-danger">7-11</span>';
                case '全家': return '<span class="badge bg-primary">全家</span>';
                case '萊爾富': return '<span class="badge bg-warning text-dark">萊爾富</span>';
                default: return '<span class="badge bg-secondary">其他</span>';
            }
        }

        function parseAmountFromBarcode(barcodeText) {
            if (!barcodeText) return 100;
            if (barcodeText.includes('0100') || (barcodeText.length === 13 && barcodeText.startsWith('9100'))) {
                return 100;
            }
            if (barcodeText.includes('0500')) return 500;
            if (barcodeText.includes('1000')) return 1000;
            return 100;
        }

        // 建立共用並加強支援多種格式的 ZXing Reader
        function getCodeReader() {
            if (!codeReader) {
                const hints = new Map();
                const formats = [
                    ZXing.BarcodeFormat.CODE_128,
                    ZXing.BarcodeFormat.CODE_39,
                    ZXing.BarcodeFormat.EAN_13,
                    ZXing.BarcodeFormat.EAN_8,
                    ZXing.BarcodeFormat.UPC_A,
                    ZXing.BarcodeFormat.UPC_E,
                    ZXing.BarcodeFormat.ITF
                ];
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                codeReader = new ZXing.BrowserBarcodeReader(hints);
            }
            return codeReader;
        }

        // 批量圖片智慧解碼（含影像前處理：自動放大、增強對比，解決全家與遠距離讀取失敗問題）
        async function handleBatchImages(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const readerInstance = getCodeReader();
            let successCount = 0;
            let failCount = 0;

            for (let file of files) {
                try {
                    const barcodeText = await decodeImageFileWithPreprocessing(file, readerInstance);
                    if (barcodeText) {
                        let detectedStore = "7-11";
                        if (barcodeText.startsWith('9') || barcodeText.startsWith('2') || barcodeText.length === 13) {
                            detectedStore = "全家";
                        }

                        const smartAmount = parseAmountFromBarcode(barcodeText);

                        const newCard = {
                            id: Date.now() + Math.random(),
                            storeName: detectedStore,
                            cardTitleName: `批量匯入 (${barcodeText.slice(-4)})`,
                            barcodeNumber: barcodeText,
                            initialAmount: smartAmount,
                            remainingAmount: smartAmount,
                            expiryDate: ''
                        };
                        cards.push(newCard);
                        successCount++;
                    } else {
                        failCount++;
                    }
                } catch (err) {
                    failCount++;
                }
            }

            localStorage.setItem('convenience_store_cards_v3', JSON.stringify(cards));
            renderCards();
            alert(`批量匯入完成！成功解析 ${successCount} 張，失敗/無條碼 ${failCount} 張。`);
            event.target.value = '';
        }

        // 影像前處理核心：縮放、提升對比，確保全家與小條碼順利辨識
        function decodeImageFileWithPreprocessing(file, reader) {
            return new Promise((resolve) => {
                const readerObj = new FileReader();
                readerObj.onload = function(e) {
                    const img = new Image();
                    img.onload = async function() {
                        // 建立 Canvas 進行影像增強
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // 若圖片太小強制放大 2 倍以符合條碼辨識像素，若太大則適度限制
                        let width = img.width;
                        let height = img.height;
                        const targetWidth = width < 1000 ? width * 2 : width;
                        
                        canvas.width = targetWidth;
                        canvas.height = height * (targetWidth / width);
                        
                        // 繪製並提高對比度與清晰度
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        // 嘗試方法 1：直接從原始解析度解碼
                        try {
                            const res = await reader.decodeFromImageElement(img);
                            if (res && res.text) {
                                resolve(res.text);
                                return;
                            }
                        } catch (err) {}

                        // 嘗試方法 2：從處理後的 Canvas DataURL 解碼
                        try {
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.98);
                            const processedImg = new Image();
                            processedImg.onload = async function() {
                                try {
                                    const res2 = await reader.decodeFromImageElement(processedImg);
                                    resolve(res2 ? res2.text : null);
                                } catch (ex) {
                                    resolve(null);
                                }
                            };
                            processedImg.src = dataUrl;
                        } catch (ex) {
                            resolve(null);
                        }
                    };
                    img.src = e.target.result;
                };
                readerObj.readAsDataURL(file);
            });
        }

        function syncRemaining(el) {
            const cardId = document.getElementById('cardId').value;
            if (!cardId) {
                document.getElementById('remainingAmount').value = el.value;
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = '新增商品卡';
            document.getElementById('cardForm').reset();
            document.getElementById('cardId').value = '';
            stopScanner();
        }

        function openEditModal(id) {
            document.getElementById('modalTitle').innerText = '編輯商品卡';
            const card = cards.find(c => c.id === id);
            if (card) {
                document.getElementById('cardId').value = card.id;
                document.getElementById('storeName').value = card.storeName;
                document.getElementById('cardTitleName').value = card.cardTitleName;
                document.getElementById('barcodeNumber').value = card.barcodeNumber;
                document.getElementById('initialAmount').value = card.initialAmount;
                document.getElementById('remainingAmount').value = card.remainingAmount;
                document.getElementById('expiryDate').value = card.expiryDate || '';
                cardModal.show();
            }
        }

        // 開啟高畫質相機掃描（加入強制自動對焦與高畫質解析度設定，解決 10-20 公分模糊問題）
        async function startScanner() {
            const container = document.getElementById('videoContainer');
            const tip = document.getElementById('scannerTip');
            container.style.display = 'block';
            tip.style.display = 'block';

            const reader = getCodeReader();
            
            try {
                const videoInputDevices = await reader.listVideoInputDevices();
                let selectedDeviceId = videoInputDevices[0]?.deviceId;

                for (const device of videoInputDevices) {
                    const label = device.label.toLowerCase();
                    if (label.includes('back') || label.includes('rear') || label.includes('environment') || label.includes('主鏡頭')) {
                        selectedDeviceId = device.deviceId;
                        break;
                    }
                }

                // 強制設定高畫質與連續對焦參數
                const constraints = {
                    video: {
                        deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        facingMode: "environment",
                        advanced: [{ focusMode: "continuous" }]
                    }
                };

                reader.decodeFromConstraints(constraints, 'interactive', (result, err) => {
                    if (result) {
                        document.getElementById('barcodeNumber').value = result.text;
                        stopScanner();
                        if (navigator.vibrate) navigator.vibrate(100);
                    }
                });
            } catch (err) {
                console.error(err);
                // 退回基本設定，若進階對焦不被部分舊手機支援時自動容錯
                try {
                    const fallbackConstraints = { video: { facingMode: "environment" } };
                    reader.decodeFromConstraints(fallbackConstraints, 'interactive', (result) => {
                        if (result) {
                            document.getElementById('barcodeNumber').value = result.text;
                            stopScanner();
                            if (navigator.vibrate) navigator.vibrate(100);
                        }
                    });
                } catch (e) {
                    alert('無法啟動相機，請檢查瀏覽器相機權限或是否使用 HTTPS/Localhost。');
                }
            }
        }

        function stopScanner() {
            if (codeReader) {
                codeReader.reset();
            }
            const container = document.getElementById('videoContainer');
            const tip = document.getElementById('scannerTip');
            if (container) container.style.display = 'none';
            if (tip) tip.style.display = 'none';
        }

        function showBarcodeModal(id) {
            const card = cards.find(c => c.id === id);
            if (!card) return;
            currentDeductingId = id;
            document.getElementById('barcodeCardInfo').innerText = `${card.storeName} - ${card.cardTitleName} (剩餘: $${card.remainingAmount})`;
            document.getElementById('barcodeTextDisplay').innerText = card.barcodeNumber;
            document.getElementById('quickDeductAmount').value = '';
            document.getElementById('calcPreviewBox').style.display = 'none';
            
            try {
                JsBarcode("#barcodeSvg", card.barcodeNumber, {
                    format: "CODE128",
                    lineColor: "#000",
                    width: 2,
                    height: 70,
                    displayValue: false
                });
            } catch (e) {
                console.error(e);
            }

            barcodeModal.show();
        }

        function previewAutoCalc(el) {
            const card = cards.find(c => c.id === currentDeductingId);
            if (!card) return;

            const deductVal = Number(el.value);
            const previewBox = document.getElementById('calcPreviewBox');
            const previewRemaining = document.getElementById('previewRemaining');

            if (!el.value || deductVal <= 0) {
                previewBox.style.display = 'none';
                return;
            }

            let calculatedRem = card.remainingAmount - deductVal;
            if (calculatedRem < 0) calculatedRem = 0;

            previewRemaining.innerText = `$${calculatedRem.toLocaleString()}`;
            previewBox.style.display = 'block';
        }

        function confirmDeduct() {
            const deductVal = Number(document.getElementById('quickDeductAmount').value);
            const card = cards.find(c => c.id === currentDeductingId);
            
            if (!deductVal || deductVal <= 0) {
                alert('請輸入有效的消費金額');
                return;
            }

            if (deductVal > card.remainingAmount) {
                if (!confirm('提示：輸入的扣款金額大於目前剩餘金額，確定要將餘額歸零嗎？')) {
                    return;
                }
            }

            cards = cards.map(c => {
                if (c.id === currentDeductingId) {
                    let newRem = c.remainingAmount - deductVal;
                    if (newRem < 0) newRem = 0;
                    return { ...c, remainingAmount: newRem };
                }
                return c;
            });

            localStorage.setItem('convenience_store_cards_v3', JSON.stringify(cards));
            barcodeModal.hide();
            renderCards();
            alert('扣款成功！剩餘金額已自動更新。');
        }

        function saveCard(e) {
            e.preventDefault();
            stopScanner();
            const id = document.getElementById('cardId').value;
            const storeName = document.getElementById('storeName').value;
            const cardTitleName = document.getElementById('cardTitleName').value;
            const barcodeNumber = document.getElementById('barcodeNumber').value;
            const initialAmount = Number(document.getElementById('initialAmount').value);
            const remainingAmount = Number(document.getElementById('remainingAmount').value);
            const expiryDate = document.getElementById('expiryDate').value;

            if (id) {
                cards = cards.map(c => c.id == id ? { ...c, storeName, cardTitleName, barcodeNumber, initialAmount, remainingAmount, expiryDate } : c);
            } else {
                const newCard = {
                    id: Date.now(),
                    storeName,
                    cardTitleName,
                    barcodeNumber,
                    initialAmount,
                    remainingAmount,
                    expiryDate
                };
                cards.push(newCard);
            }

            localStorage.setItem('convenience_store_cards_v3', JSON.stringify(cards));
            cardModal.hide();
            renderCards();
        }

        function deleteCard(id) {
            if (confirm('確定要刪除這張商品卡紀錄嗎？')) {
                cards = cards.filter(c => c.id !== id);
                localStorage.setItem('convenience_store_cards_v3', JSON.stringify(cards));
                renderCards();
            }
        }

        function renderCards() {
            const tbody = document.getElementById('cardTableBody');
            const filterStore = document.getElementById('filterStore').value;
            tbody.innerHTML = '';

            let totalInit = 0;
            let totalRem = 0;

            const filteredCards = cards.filter(c => !filterStore || c.storeName === filterStore);

            if (filteredCards.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-muted py-4">目前沒有相關商品卡資料，請點擊右上角新增或從相簿批量匯入。</td></tr>`;
            }

            filteredCards.forEach(card => {
                totalInit += Number(card.initialAmount);
                totalRem += Number(card.remainingAmount);

                const isDepleted = Number(card.remainingAmount) <= 0;
                let statusBadge = '<span class="badge bg-success">正常使用</span>';
                
                if (isDepleted) {
                    statusBadge = '<span class="badge bg-dark">使用完畢</span>';
                } else if (card.expiryDate && new Date(card.expiryDate) < new Date()) {
                    statusBadge = '<span class="badge bg-danger">已過期</span>';
                }

                const tr = document.createElement('tr');
                if (isDepleted) {
                    tr.classList.add('card-depleted');
                }

                tr.innerHTML = `
                    <td>${getStoreBadge(card.storeName)}</td>
                    <td class="text-start ps-3">
                        <div class="fw-bold">${card.cardTitleName}</div>
                        <small class="text-muted font-monospace">條碼: ${card.barcodeNumber}</small>
                    </td>
                    <td>$${Number(card.initialAmount).toLocaleString()}</td>
                    <td class="fw-bold text-success">$${Number(card.remainingAmount).toLocaleString()}</td>
                    <td>${card.expiryDate || '無期限'}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <button class="btn btn-sm btn-warning text-dark me-1" onclick="showBarcodeModal(${card.id})" title="出示條碼付款" ${isDepleted ? 'disabled' : ''}><i class="bi bi-upc-scan"></i> 結帳</button>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${card.id})" title="編輯"><i class="bi bi-pencil-square"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteCard(${card.id})" title="刪除"><i class="bi bi-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalInitial').innerText = `$${totalInit.toLocaleString()}`;
            document.getElementById('totalRemaining').innerText = `$${totalRem.toLocaleString()}`;
            document.getElementById('totalUsed').innerText = `$${(totalInit - totalRem).toLocaleString()}`;
        }

        renderCards();
    </script>
</body>
</html>

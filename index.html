<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>禮券管理系統</title>
  <!-- 引入 QuaggaJS 用於相機即時掃描一維條碼 -->
  <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.10/dist/quagga.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
      color: #333;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    .scanner-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-submit { background-color: #28a745; color: white; width: 100%; font-size: 18px; }
    
    /* 相機預覽區域樣式 */
    #interactive.viewport {
      position: relative;
      width: 100%;
      height: 250px;
      overflow: hidden;
      border: 2px dashed #007bff;
      border-radius: 6px;
      background: #000;
    }
    #interactive.viewport canvas, #interactive.viewport video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .scan-status {
      font-size: 14px;
      color: #28a745;
      margin-top: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>新增禮券資料</h2>

  <form id="card-form">
    
    <!-- 1. 必填項目範例 (例如名稱) -->
    <div class="form-group">
      <label for="card-name">禮券名稱：</label>
      <input type="text" id="card-name" required placeholder="請輸入禮券名稱">
    </div>

    <!-- 2. 主要功能：相機 / 照片掃描條碼 -->
    <div class="form-group">
      <label>一維條碼獲取（主要）：</label>
      <div class="scanner-actions">
        <button type="button" id="start-scan-btn" class="btn btn-primary">📷 相機掃描</button>
        
        <label class="btn btn-secondary">
          🖼️ 照片上傳
          <input type="file" id="barcode-file-input" accept="image/*" capture="environment" style="display:none;">
        </label>
      </div>

      <!-- 相機預覽畫面 -->
      <div id="interactive" class="viewport" style="display: none;"></div>
      <div id="scan-message" class="scan-status"></div>
    </div>

    <!-- 3. 次要功能：手動輸入條碼（已設為非必填） -->
    <div class="form-group">
      <label for="barcode">條碼內容（選填）：</label>
      <!-- 注意：已移除 required 屬性 -->
      <input type="text" id="barcode" name="barcode" placeholder="自動獲取，或於掃描失敗時手動輸入">
    </div>

    <button type="submit" class="btn btn-submit">儲存禮券</button>

  </form>

  <script>
    const barcodeInput = document.getElementById('barcode');
    const scanMessage = document.getElementById('scan-message');
    const viewport = document.getElementById('interactive');

    // 填入條碼結果並提醒用戶
    function setBarcodeResult(code) {
      barcodeInput.value = code;
      scanMessage.textContent = `✓ 已成功識別條碼：${code}`;
    }

    // -------------------------------------------------------------
    // 功能 1：照片上傳辨識 (使用瀏覽器原生 BarcodeDetector API)
    // -------------------------------------------------------------
    document.getElementById('barcode-file-input').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      if ('BarcodeDetector' in window) {
        try {
          const barcodeDetector = new BarcodeDetector({
            formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'upc_e']
          });
          const imageBitmap = await createImageBitmap(file);
          const barcodes = await barcodeDetector.detect(imageBitmap);

          if (barcodes.length > 0) {
            setBarcodeResult(barcodes[0].rawValue);
          } else {
            alert('無法從照片中辨識出一維條碼，請手動填寫或重新拍攝。');
          }
        } catch (err) {
          console.error('照片解析錯誤:', err);
          alert('解析照片失敗，請改用手動輸入。');
        }
      } else {
        alert('您的瀏覽器不支援原生照片條碼辨識，請手動輸入條碼。');
      }
    });

    // -------------------------------------------------------------
    // 功能 2：相機即時鏡頭掃描 (使用 QuaggaJS)
    // -------------------------------------------------------------
    document.getElementById('start-scan-btn').addEventListener('click', function() {
      viewport.style.display = 'block';

      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: viewport,
          constraints: {
            facingMode: "environment" // 優先使用後置鏡頭
          }
        },
        decoder: {
          readers: ["code_128_reader", "ean_reader", "ean_8_reader", "code_39_reader", "upc_reader"]
        }
      }, function(err) {
        if (err) {
          console.error('相機開啟失敗:', err);
          alert('無法開啟相機，請確認是否提供鏡頭權限。');
          viewport.style.display = 'none';
          return;
        }
        Quagga.start();
      });

      // 監聽掃描結果
      Quagga.onDetected(function(result) {
        if (result && result.codeResult) {
          const code = result.codeResult.code;
          setBarcodeResult(code);
          Quagga.stop();
          viewport.style.display = 'none';
        }
      });
    });

    // -------------------------------------------------------------
    // 功能 3：表單提交邏輯（驗證）
    // -------------------------------------------------------------
    document.getElementById('card-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const cardName = document.getElementById('card-name').value;
      const barcode = barcodeInput.value; // 非必填，即使空白也能正常通過

      alert(`表單提交成功！\n禮券名稱：${cardName}\n條碼：${barcode || '（未提供）'}`);
    });
  </script>

</body>
</html>

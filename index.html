<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便利商品卡管理系統</title>
    <!-- Tailwind CSS 確保介面直覺、簡單 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QuaggaJS 用於一維條碼掃描 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        .grayscale-card {
            filter: grayscale(100%);
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">💳 我的商品卡錢包</h1>
            <div class="space-x-2">
                <button onclick="openAddModal()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                    + 新增商品卡
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto px-4 py-6">
        <!-- 搜尋與篩選列 -->
        <div class="mb-6 flex flex-col sm:flex-row gap-3">
            <input type="text" id="searchInput" placeholder="搜尋商品名稱或超商..." oninput="renderCards()" class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <select id="storeFilter" onchange="renderCards()" class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="">全部超商/通路</option>
                <option value="7-11">7-11 統一超商</option>
                <option value="全家">全家便利商店</option>
                <option value="萊爾富">萊爾富</option>
                <option value="OK超商">OK超商</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <!-- 商品卡列表 (依到期日優先排序) -->
        <div id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 動態載入 -->
        </div>
    </main>

    <!-- 新增/編輯 Modal -->
    <div id="cardModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <h2 id="modalTitle" class="text-lg font-bold mb-4">新增商品卡</h2>
            <form id="cardForm" onsubmit="saveCard(event)" class="space-y-4">
                <input type="hidden" id="cardId">
                <div>
                    <label class="block text-sm font-medium mb-1">商品名稱</label>
                    <input type="text" id="cardName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">超商/通路 (自動或手動)</label>
                    <select id="cardStore" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500">
                        <option value="7-11">7-11 統一超商</option>
                        <option value="全家">全家便利商店</option>
                        <option value="萊爾富">萊爾富</option>
                        <option value="OK超商">OK超商</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium mb-1">剩餘金額/數量</label>
                        <input type="number" id="cardBalance" step="any" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">有效期限 (選填)</label>
                        <input type="date" id="cardExpiry" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">一維條碼數字</label>
                    <input type="text" id="cardBarcode" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500">
                </div>
                <!-- 批次照片上傳/相機掃描區 -->
                <div class="border-2 border-dashed border-gray-300 p-4 rounded-lg text-center">
                    <p class="text-sm text-gray-500 mb-2">上傳商品卡截圖或相機辨識</p>
                    <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageUpload(event)" class="text-sm">
                </div>
                <div class="flex justify-end space-x-2 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-100">取消</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 結帳展示條碼 Modal -->
    <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-sm w-full p-6 text-center shadow-xl">
            <h3 id="checkoutName" class="text-xl font-bold mb-2">商品名稱</h3>
            <p id="checkoutStore" class="text-sm text-emerald-600 font-semibold mb-4"></p>
            <div class="bg-gray-100 p-4 rounded-lg mb-4">
                <div id="barcodeDisplay" class="font-mono text-2xl tracking-widest font-bold my-2 py-4 bg-white border rounded"></div>
                <p class="text-xs text-gray-500">請向店員出示上方條碼</p>
            </div>
            <div class="mb-4 text-left">
                <label class="block text-sm font-medium mb-1">本次結帳扣除金額/數量：</label>
                <input type="number" id="deductAmount" value="1" step="any" class="w-full px-3 py-2 border rounded-lg text-center font-bold">
            </div>
            <div class="flex space-x-2">
                <button onclick="closeCheckoutModal()" class="flex-1 py-2 border rounded-lg text-gray-600">關閉</button>
                <button onclick="confirmCheckout()" class="flex-1 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">確認扣款</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 初始化本地儲存資料
        let cards = JSON.parse(localStorage.getItem('my_product_cards')) || [
            { id: '1', name: '統一布丁 (測試卡)', store: '7-11', balance: 50, expiry: '2026-06-30', barcode: '4710088432109' },
            { id: '2', name: '中杯拿鐵', store: '全家', balance: 0, expiry: '2026-04-10', barcode: '4712345678901' }
        ];

        let currentCheckoutId = null;

        function saveToStorage() {
            localStorage.setItem('my_product_cards', JSON.stringify(cards));
        }

        // 自動辨識超商邏輯
        function detectStore(text) {
            if (text.includes('7-11') || text.includes('統一') || text.includes('ibon')) return '7-11';
            if (text.includes('全家') || text.includes('Fami') || text.includes('FamiPort')) return '全家';
            if (text.includes('萊爾富') || text.includes('Hi-Life')) return '萊爾富';
            if (text.includes('OK') || text.includes('OK超商')) return 'OK超商';
            return '其他';
        }

        // 渲染商品卡列表 (規則：若有期限，優先顯示快到期之商品卡)
        function renderCards() {
            const grid = document.getElementById('cardGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filterStore = document.getElementById('storeFilter').value;

            let filtered = cards.filter(card => {
                const matchSearch = card.name.toLowerCase().includes(search) || card.store.toLowerCase().includes(search);
                const matchStore = filterStore === '' || card.store === filterStore;
                return matchSearch && matchStore;
            });

            // 排序：有期限者優先，日期越近越前面；沒有期限者排在後面
            filtered.sort((a, b) => {
                if (!a.expiry) return 1;
                if (!b.expiry) return -1;
                return new Date(a.expiry) - new Date(b.expiry);
            });

            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-2 text-center text-gray-400 py-10">沒有找到相關商品卡</p>`;
                return;
            }

            filtered.forEach(card => {
                const isDepleted = card.balance <= 0;
                const cardClass = isDepleted ? 'grayscale-card bg-gray-100 border-gray-300' : 'bg-white border-emerald-100 shadow-sm hover:shadow-md';
                
                grid.innerHTML += `
                    <div class="border rounded-xl p-4 flex flex-col justify-between transition ${cardClass}">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-800">${card.store}</span>
                                <div class="space-x-1">
                                    <button onclick="openEditModal('${card.id}')" class="text-gray-400 hover:text-blue-600 text-sm">✏️</button>
                                    <button onclick="deleteCard('${card.id}')" class="text-gray-400 hover:text-red-600 text-sm">🗑️</button>
                                </div>
                            </div>
                            <h3 class="font-bold text-lg mb-1">${card.name}</h3>
                            <p class="text-sm text-gray-500 mb-2">期限：${card.expiry || '無期限'}</p>
                        </div>
                        <div>
                            <div class="flex justify-between items-end mt-4">
                                <div>
                                    <span class="text-xs text-gray-400 block">剩餘餘額/數量</span>
                                    <span class="text-xl font-black ${isDepleted ? 'text-gray-500' : 'text-emerald-600'}">${card.balance}</span>
                                </div>
                                ${isDepleted ? 
                                    '<span class="bg-red-100 text-red-700 text-xs font-bold px-2.5 py-1 rounded">已使用完畢</span>' : 
                                    `<button onclick="openCheckoutModal('${card.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">出示結帳</button>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // 開啟新增 Modal
        function openAddModal() {
            document.getElementById('modalTitle').innerText = '新增商品卡';
            document.getElementById('cardForm').reset();
            document.getElementById('cardId').value = '';
            document.getElementById('cardModal').classList.remove('hidden');
        }

        // 開啟編輯 Modal
        function openEditModal(id) {
            const card = cards.find(c => c.id === id);
            if (!card) return;
            document.getElementById('modalTitle').innerText = '編輯商品卡';
            document.getElementById('cardId').value = card.id;
            document.getElementById('cardName').value = card.name;
            document.getElementById('cardStore').value = card.store;
            document.getElementById('cardBalance').value = card.balance;
            document.getElementById('cardExpiry').value = card.expiry || '';
            document.getElementById('cardBarcode').value = card.barcode;
            document.getElementById('cardModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('cardModal').classList.add('hidden');
        }

        // 儲存商品卡（支援新增與編輯）
        function saveCard(e) {
            e.preventDefault();
            const id = document.getElementById('cardId').value;
            const name = document.getElementById('cardName').value;
            const store = document.getElementById('cardStore').value;
            const balance = parseFloat(document.getElementById('cardBalance').value);
            const expiry = document.getElementById('cardExpiry').value;
            const barcode = document.getElementById('cardBarcode').value;

            if (id) {
                const card = cards.find(c => c.id === id);
                card.name = name;
                card.store = store;
                card.balance = balance;
                card.expiry = expiry;
                card.barcode = barcode;
            } else {
                const newCard = {
                    id: Date.now().toString(),
                    name, store, balance, expiry, barcode
                };
                cards.push(newCard);
            }

            saveToStorage();
            closeModal();
            renderCards();
        }

        // 刪除商品卡
        function deleteCard(id) {
            if (confirm('確定要刪除這張商品卡嗎？')) {
                cards = cards.filter(c => c.id !== id);
                saveToStorage();
                renderCards();
            }
        }

        // 批次照片上傳與智慧模擬解析
        function handleImageUpload(e) {
            const files = e.target.files;
            if (!files.length) return;

            // 模擬批次匯入與文字辨識（可整合 OCR 服務，此處以自動帶入為範例）
            for (let i = 0; i < files.length; i++) {
                const file = files.name;
                // 模擬從檔名或圖片內容辨識
                const autoName = "批次匯入商品 " + (cards.length + 1);
                const autoStore = detectStore(file);
                
                cards.push({
                    id: Date.now().toString() + i,
                    name: autoName,
                    store: autoStore,
                    balance: 1, // 預設數量
                    expiry: '',
                    barcode: '1234567890' + Math.floor(Math.random() * 1000)
                });
            }
            saveToStorage();
            renderCards();
            alert(`成功批次匯入 ${files.length} 張商品卡！請至列表編輯詳細資訊與條碼。`);
        }

        // 結帳相關功能
        function openCheckoutModal(id) {
            currentCheckoutId = id;
            const card = cards.find(c => c.id === id);
            if (!card) return;

            document.getElementById('checkoutName').innerText = card.name;
            document.getElementById('checkoutStore').innerText = card.store;
            document.getElementById('barcodeDisplay').innerText = card.barcode;
            document.getElementById('deductAmount').value = 1;
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').classList.add('hidden');
            currentCheckoutId = null;
        }

        function confirmCheckout() {
            const deduct = parseFloat(document.getElementById('deductAmount').value);
            const card = cards.find(c => c.id === currentCheckoutId);
            if (!card) return;

            card.balance = Math.max(0, card.balance - deduct);
            saveToStorage();
            closeCheckoutModal();
            renderCards();
        }

        // 初始化載入
        renderCards();
    </script>
</body>
</html>

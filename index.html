<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧商品卡皮夾</title>
    <!-- 引入 Tailwind CSS 確保介面直覺、美觀、行動裝置友善 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 JsBarcode 用於動態生成一維條碼 -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        .grayscale-card {
            filter: grayscale(100%);
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-12">

    <!-- 頂部導航列 -->
    <header class="bg-white shadow-sm sticky top-0 z-20">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                💳 智慧商品卡皮夾
            </h1>
            <div class="flex gap-2">
                <button onclick="openAddModal()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium shadow hover:bg-indigo-700 transition">
                    + 新增卡片
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto px-4 mt-4 space-y-4">
        
        <!-- 搜尋與篩選列 -->
        <div class="flex gap-2">
            <input type="text" id="searchInput" placeholder="搜尋超商或商品名稱..." oninput="renderCards()" 
                   class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <select id="sortSelect" onchange="renderCards()" class="border rounded-lg px-2 text-sm bg-white">
                <option value="expiry">優先期限到期</option>
                <option value="balance">餘額多到少</option>
            </select>
        </div>

        <!-- 批次匯入/相機掃描模擬區 -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-dashed border-indigo-300 flex justify-around text-sm">
            <label class="cursor-pointer text-indigo-600 font-medium hover:underline flex items-center gap-1">
                📷 照片批次匯入
                <input type="file" accept="image/*" multiple class="hidden" onchange="batchImportImages(event)">
            </label>
            <span class="text-gray-300">|</span>
            <button onclick="alert('已啟動相機掃描（模擬）：自動辨識條碼與超商中...'); simulateScan();" class="text-indigo-600 font-medium hover:underline">
                ⚡ 單張相機掃描
            </button>
        </div>

        <!-- 商品卡列表 -->
        <div id="cardList" class="space-y-3">
            <!-- 動態生成卡片 -->
        </div>
    </main>

    <!-- 結帳/出示條碼 Modal -->
    <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl text-center relative">
            <button onclick="closeCheckoutModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            
            <div id="modalStoreBadge" class="inline-block px-3 py-1 rounded-full text-xs font-bold mb-2"></div>
            <h3 id="modalCardTitle" class="text-lg font-bold text-gray-800 mb-4"></h3>

            <!-- 一維條碼容器 -->
            <div class="bg-gray-50 p-4 rounded-xl border mb-4 flex justify-center">
                <svg id="barcodeSvg"></svg>
            </div>
            <p id="modalBarcodeText" class="text-xs text-gray-500 mb-4 font-mono tracking-widest"></p>

            <div class="bg-indigo-50 p-3 rounded-xl mb-4 flex justify-between items-center">
                <span class="text-sm text-gray-600">目前剩餘價值：</span>
                <span id="modalBalance" class="text-xl font-bold text-indigo-600"></span>
            </div>

            <div class="flex gap-2">
                <button onclick="useCard(1)" class="flex-1 bg-red-500 text-white py-2 rounded-xl text-sm font-medium hover:bg-red-600 transition">
                    扣款 1 元/份
                </button>
                <button onclick="useCard(10)" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition">
                    全部折抵完畢
                </button>
            </div>
        </div>
    </div>

    <!-- 手動新增卡片 Modal -->
    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl relative">
            <h3 class="text-lg font-bold text-gray-800 mb-4">新增商品卡</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-500">超商類型 (自動或手動)</label>
                    <select id="addStore" class="w-full mt-1 border rounded-lg p-2 text-sm">
                        <option value="7-11">7-ELEVEN</option>
                        <option value="全家">全家便利商店</option>
                        <option value="萊爾富">萊爾富</option>
                        <option value="OK超商">OK超商</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-500">商品名稱</label>
                    <input type="text" id="addTitle" placeholder="例如：中杯拿鐵" class="w-full mt-1 border rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-gray-500">一維條碼數字</label>
                    <input type="text" id="addBarcode" placeholder="例如：9876543210123" class="w-full mt-1 border rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-gray-500">總金額 / 數量餘額</label>
                    <input type="number" id="addBalance" placeholder="例如：100 或 5" class="w-full mt-1 border rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-gray-500">有效期限</label>
                    <input type="date" id="addExpiry" class="w-full mt-1 border rounded-lg p-2 text-sm">
                </div>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeAddModal()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-medium">取消</button>
                <button onclick="saveNewCard()" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium">儲存</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯實作 -->
    <script>
        // 初始模擬資料
        let cards = [
            { id: 1, store: '7-11', title: 'CITY CAFE 中杯拿鐵', barcode: '4710088123456', balance: 3, expiry: '2026-06-30' },
            { id: 2, store: '全家', title: 'FamiCollection 綠茶', barcode: '4711234567890', balance: 0, expiry: '2026-04-15' },
            { id: 3, store: '萊爾富', title: 'Hi Café 大杯美式', barcode: '4719876543210', balance: 1, expiry: '2026-05-10' }
        ];

        let currentActiveCardId = null;

        // 超商標籤顏色對應
        const storeColors = {
            '7-11': 'bg-orange-100 text-orange-600 border-orange-200',
            '全家': 'bg-green-100 text-green-600 border-green-200',
            '萊爾富': 'bg-red-100 text-red-600 border-red-200',
            'OK超商': 'bg-blue-100 text-blue-600 border-blue-200'
        };

        // 渲染商品卡清單
        function renderCards() {
            const listEl = document.getElementById('cardList');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const sortVal = document.getElementById('sortSelect').value;

            let filtered = cards.filter(c => c.title.toLowerCase().includes(searchVal) || c.store.toLowerCase().includes(searchVal));

            // 排序邏輯：4. 若有期限，優先顯示快到期之商品卡
            filtered.sort((a, b) => {
                if (sortVal === 'expiry') {
                    return new Date(a.expiry) - new Date(b.expiry);
                } else {
                    return b.balance - a.balance;
                }
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">找不到符合的商品卡</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(card => {
                const isDepleted = card.balance <= 0;
                const cardClass = isDepleted ? 'grayscale-card bg-gray-100' : 'bg-white hover:border-indigo-300';
                const storeBadgeStyle = storeColors[card.store] || 'bg-gray-100 text-gray-600';

                return `
                    <div onclick="openCheckoutModal(${card.id})" class="${cardClass} border rounded-2xl p-4 shadow-sm transition cursor-pointer relative flex justify-between items-center">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="px-2 py-0.5 rounded-full text-xs font-bold border ${storeBadgeStyle}">${card.store}</span>
                                <span class="text-xs text-gray-400">期限：${card.expiry}</span>
                            </div>
                            <h3 class="font-bold text-gray-800 text-base">${card.title}</h3>
                            <p class="text-xs text-gray-500 font-mono mt-1">條碼：${card.barcode}</p>
                        </div>
                        <div class="text-right">
                            ${isDepleted ? 
                                `<span class="bg-gray-200 text-gray-600 text-xs px-2.5 py-1 rounded-full font-bold">已使用完畢</span>` : 
                                `<span class="text-lg font-extrabold text-indigo-600">剩餘 ${card.balance}</span>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 開啟結帳/出示條碼視窗 (功能 2)
        function openCheckoutModal(id) {
            currentActiveCardId = id;
            const card = cards.find(c => c.id === id);
            if (!card) return;

            document.getElementById('modalCardTitle').innerText = card.title;
            document.getElementById('modalBalance').innerText = card.balance;
            document.getElementById('modalBarcodeText').innerText = card.barcode;
            
            const badge = document.getElementById('modalStoreBadge');
            badge.innerText = card.store;
            badge.className = `inline-block px-3 py-1 rounded-full text-xs font-bold mb-2 border ${storeColors[card.store]}`;

            // 生成一維條碼
            try {
                JsBarcode("#barcodeSvg", card.barcode, {
                    format: "CODE128",
                    width: 2,
                    height: 60,
                    displayValue: false
                });
            } catch (e) {
                console.error("條碼生成失敗", e);
            }

            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        // 扣款並同步更新餘額 (功能 2 & 3)
        function useCard(amount) {
            const card = cards.find(c => c.id === currentActiveCardId);
            if (!card) return;

            card.balance = Math.max(0, card.balance - amount);
            document.getElementById('modalBalance').innerText = card.balance;
            
            renderCards();

            if (card.balance === 0) {
                alert('此商品卡已使用完畢！');
                closeCheckoutModal();
            } else {
                alert(`扣款成功！剩餘數量：${card.balance}`);
            }
        }

        // 模擬相機單張掃描 / 智慧辨識超商 (功能 1 & 5)
        function simulateScan() {
            setTimeout(() => {
                // 模擬系統自動辨識結果
                const mockScanned = {
                    id: Date.now(),
                    store: '7-11', // 自動辨識
                    title: '【自動辨識】御茶園特萃茶',
                    barcode: '4719999' + Math.floor(100000 + Math.random() * 900000),
                    balance: 1,
                    expiry: '2026-12-31'
                };
                cards.unshift(mockScanned);
                renderCards();
                alert('成功透過相機掃描並自動辨識超商與條碼！');
            }, 1000);
        }

        // 模擬照片批次匯入 (功能 1 & 5)
        function batchImportImages(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            // 模擬批次辨識多張截圖
            for (let i = 0; i < files.length; i++) {
                cards.unshift({
                    id: Date.now() + i,
                    store: i % 2 === 0 ? '全家' : '7-11', // 自動辨識超商
                    title: `【批次匯入】商品卡 #${i + 1}`,
                    barcode: '4718888' + Math.floor(10000 + Math.random() * 90000),
                    balance: Math.floor(1 + Math.random() * 5),
                    expiry: '2026-08-30'
                });
            }
            renderCards();
            alert(`成功批次匯入 ${files.length} 張商品卡截圖！`);
        }

        // 手動新增相關控制
        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }
        
        function saveNewCard() {
            const store = document.getElementById('addStore').value;
            const title = document.getElementById('addTitle').value;
            const barcode = document.getElementById('addBarcode').value;
            const balance = parseInt(document.getElementById('addBalance').value);
            const expiry = document.getElementById('addExpiry').value;

            if (!title || !barcode || isNaN(balance) || !expiry) {
                alert('請完整填寫所有欄位！');
                return;
            }

            cards.unshift({ id: Date.now(), store, title, barcode, balance, expiry });
            renderCards();
            closeAddModal();
        }

        // 初始化渲染
        renderCards();
    </script>
</body>
</html>

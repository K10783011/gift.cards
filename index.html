<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品卡管理系統</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- ZXing 掃描庫 -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card-summary { border-left: 5px solid #0d6efd; }
        #videoContainer { max-width: 100%; height: 320px; display: none; position: relative; background: #000; border-radius: 8px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .scanner-frame {
            position: absolute; top: 25%; bottom: 25%; left: 10%; right: 10%;
            border: 2px solid #0d6efd; background-color: rgba(13, 110, 253, 0.05);
            border-radius: 6px; z-index: 4; pointer-events: none;
            box-shadow: 0 0 15px rgba(13, 110, 253, 0.5);
        }
        .scanner-frame::after {
            content: ""; position: absolute; left: 0; right: 0; height: 2px;
            background: #ff4d4d; box-shadow: 0 0 8px #ff4d4d;
            animation: scanLine 2s infinite ease-in-out;
        }
        @keyframes scanLine {
            0% { top: 0%; } 50% { top: 98%; } 100% { top: 0%; }
        }
        .barcode-box { background: #fff; padding: 15px; border-radius: 8px; display: inline-block; max-width: 100%; overflow-x: auto; }
        .card-depleted { filter: grayscale(100%); opacity: 0.55; background-color: #e9ecef !important; }
    </style>
</head>
<body>

    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
            <h1 class="h4 fw-bold text-primary mb-0"><i class="bi bi-wallet2"></i> 商品卡管理系統</h1>
            <div class="d-flex gap-2">
                <label class="btn btn-outline-primary btn-sm mb-0" style="cursor: pointer;">
                    <i class="bi bi-images"></i> 相簿批量新增
                    <input type="file" id="batchImageInput" accept="image/*" multiple style="display: none;" onchange="handleBatchImages(event)">
                </label>
                <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#cardModal" onclick="openAddModal()">
                    <i class="bi bi-plus-circle"></i> 新增商品卡
                </button>
            </div>
        </header>

        <!-- 數據總覽 -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm card-summary">
                    <div class="card-body py-3">
                        <h6 class="text-muted small mb-1">初始總面額</h6>
                        <h4 class="fw-bold mb-0" id="totalInitial">$0</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm" style="border-left: 5px solid #198754;">
                    <div class="card-body py-3">
                        <h6 class="text-muted small mb-1">目前剩餘總額</h6>
                        <h4 class="fw-bold text-success mb-0" id="totalRemaining">$0</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm" style="border-left: 5px solid #ffc107;">
                    <div class="card-body py-3">
                        <h6 class="text-muted small mb-1">已使用金額</h6>
                        <h4 class="fw-bold text-secondary mb-0" id="totalUsed">$0</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- 卡片列表區 -->
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold fs-6">我的商品卡清單</h5>
                <select id="filterStore" class="form-select form-select-sm w-auto" onchange="renderCards()">
                    <option value="">全部超商</option>
                    <option value="7-11">7-11</option>
                    <option value="全家">全家</option>
                    <option value="萊爾富">萊爾富</option>
                    <option value="OK超商">OK超商</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-center">
                        <thead class="table-light">
                            <tr>
                                <th>超商</th>
                                <th>卡片名稱 / 條碼</th>
                                <th>原始面額</th>
                                <th>剩餘金額</th>
                                <th>有效期限</th>
                                <th>狀態</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="cardTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增/編輯 Modal -->
    <div class="modal fade" id="cardModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="cardForm" onsubmit="saveCard(event)">
                    <div class="modal-header">
                        <h5 class="modal-title fs-5" id="modalTitle">新增商品卡</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="stopScanner()"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="cardId">
                        
                        <div class="mb-3 p-3 bg-light rounded border text-center">
                            <button type="button" class="btn btn-outline-dark btn-sm mb-2" onclick="startScanner()">
                                <i class="bi bi-camera-fill"></i> 開啟高畫質對焦相機
                            </button>
                            <div id="videoContainer" class="mt-2">
                                <video id="interactive" muted playsinline></video>
                                <div class="scanner-frame"></div>
                            </div>
                            <div id="scannerTip" class="text-muted small mt-1" style="display: none;">
                                請將條碼對準藍框中央... (<a href="#" onclick="stopScanner(); return false;" class="text-danger">關閉相機</a>)
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">超商平台</label>
                            <select class="form-select" id="storeName" required>
                                <option value="7-11">7-11 統一超商</option>
                                <option value="全家">全家便利商店</option>
                                <option value="萊爾富">萊爾富</option>
                                <option value="OK超商">OK超商</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">卡片名稱 / 備註</label>
                            <input type="text" class="form-control" id="cardTitleName" placeholder="例如：商品卡A" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">條碼數字編號</label>
                            <input type="text" class="form-control font-monospace" id="barcodeNumber" placeholder="請輸入或掃描條碼" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">原始面額 (NT$)</label>
                                <input type="number" class="form-control" id="initialAmount" min="0" required oninput="syncRemaining(this)">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">剩餘金額 (NT$)</label>
                                <input type="number" class="form-control" id="remainingAmount" min="0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">有效期限 (選填)</label>
                            <input type="date" class="form-control" id="expiryDate">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" onclick="stopScanner()">取消</button>
                        <button type="submit" class="btn btn-primary btn-sm">儲存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 顯示條碼與快速扣款 Modal -->
    <div class="modal fade" id="barcodeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-header">
                    <h5 class="modal-title fs-5">出示條碼付款</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-4">
                    <h5 id="barcodeCardInfo" class="text-primary mb-3"></h5>
                    <div class="barcode-box border shadow-sm mb-2">
                        <svg id="barcodeSvg"></svg>
                    </div>
                    <p id="barcodeTextDisplay" class="font-monospace text-muted mt-1 mb-0 fw-bold fs-5"></p>
                    <hr class="my-3">
                    <div class="text-start px-2">
                        <label class="form-label fw-bold small">消費後自動扣款：</label>
                        <div class="input-group mb-2">
                            <span class="input-group-text">$</span>
                            <input type="number" id="quickDeductAmount" class="form-control" placeholder="輸入本次消費金額" oninput="previewAutoCalc(this)">
                        </div>
                        <div id="calcPreviewBox" class="alert alert-info py-2 mb-3 small" style="display: none;">
                            扣款後預估剩餘：<strong id="previewRemaining" class="text-success">$0</strong>
                        </div>
                        <button class="btn btn-success w-100" type="button" onclick="confirmDeduct()">確認扣款並更新餘額</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let cards = JSON.parse(localStorage.getItem('convenience_store_cards_v3')) || [];
        const cardModal = new bootstrap.Modal(document.getElementById('cardModal'));
        const barcodeModal = new bootstrap.Modal(document.getElementById('barcodeModal'));
        let codeReader = null;
        let currentDeductingId = null;

        function getStoreBadge(store) {
            const map = { '7-11': 'danger', '全家': 'primary', '萊爾富': 'warning text-dark', 'OK超商': 'info text-dark' };
            return `<span class="badge bg-${map[store] || 'secondary'}">${store}</span>`;
        }

        function parseAmount(text) {
            if (!text) return 100;
            if (text.includes('0500')) return 500;
            if (text.includes('1000')) return 1000;
            return 100;
        }

        function getCodeReader() {
            if (!codeReader) codeReader = new ZXing.BrowserBarcodeReader();
            return codeReader;
        }

        // 相簿批量匯入修正（加入畫布放大與對比預處理）
        async function handleBatchImages(event) {
            const files = event.target.files;
            if (!files.length) return;
            const reader = getCodeReader();
            let success = 0, fail = 0;

            for (let file of files) {
                try {
                    const text = await decodeImageFile(file, reader);
                    if (text) {
                        const store = (text.startsWith('9') || text.startsWith('2') || text.length === 13) ? "全家" : "7-11";
                        const amt = parseAmount(text);
                        cards.push({
                            id: Date.now() + Math.random(),
                            storeName: store,
                            cardTitleName: `批量匯入 (${text.slice(-4)})`,
                            barcodeNumber: text,
                            initialAmount: amt,
                            remainingAmount: amt,
                            expiryDate: ''
                        });
                        success++;
                    } else {
                        fail++;
                    }
                } catch { fail++; }
            }

            localStorage.setItem('convenience_store_cards_v3', JSON.stringify(cards));
            renderCards();
            alert(`批量匯入完成！成功解析 ${success} 張，失敗 ${fail} 張。`);
            event.target.value = '';
        }

        function decodeImageFile(file, reader) {
            return new Promise((resolve) => {
                const rObj = new FileReader();
                rObj.onload = (e) => {
                    const img = new Image();
                    img.onload = async () => {
                        // 嘗試直接解碼
                        try {
                            const res = await reader.decodeFromImageElement(img);
                            if (res?.text) { resolve(res.text); return; }
                        } catch {}

                        // Canvas 放大加強對比再次嘗試
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width * 2;
                            canvas.height = img.height * 2;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            
                            const tempImg = new Image();
                            tempImg.onload = async () => {
                                try {
                                    const res2 = await reader.decodeFromImageElement(tempImg);
                                    resolve(res2 ? res2.text : null);
                                } catch { resolve(null); }
                            };
                            tempImg.src = canvas.toDataURL('image/jpeg', 1.0);
                        } catch { resolve(null); }
                    };
                    img.src = e.target.result;
                };
                rObj.readAsDataURL(file);
            });
        }

        // 開啟高畫質、自動對焦相機
        async function startScanner() {
            document.getElementById('videoContainer').style.display = 'block';
            document.getElementById('scannerTip').style.display = 'block';
            const reader = getCodeReader();

            try {
                // 強制指定高畫質與連續對焦設定
                const constraints = {
                    video: {
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        focusMode: "continuous"
                    }
                };
                
                await reader.decodeFromConstraints(constraints, 'interactive', (result) => {
                    if (result) {
                        document.getElementById('barcodeNumber').value = result.text;
                        stopScanner();
                        if (navigator.vibrate) navigator.vibrate(100);
                    }
                });
            } catch (err) {
                alert('無法啟動相機，請檢查相機權限或確認是否使用 HTTPS。');
            }
        }

        function stopScanner() {
            if (codeReader) codeReader.reset();
            document.getElementById('videoContainer').style.display = 'none';
            document.getElementById('scannerTip').style.display = 'none';
        }

        function syncRemaining(el) {
            if (!document.getElementById('cardId').value) {
                document.getElementById('remainingAmount').value = el.value;
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = '新增商品卡';
            document.getElementById('cardForm').reset();
            document.getElementById('cardId').value = '';
            stopScanner();
        }

        function openEditModal(id) {
            document.getElementById('modalTitle').innerText = '編輯商品卡';
            const card = cards.find(c => c.id === id);
            if (card) {
                document.getElementById('cardId').value = card.id;
                document.getElementById('storeName').value = card.storeName;
                document.getElementById('cardTitleName').value = card.cardTitleName;
                document.getElementById('barcodeNumber').value = card.barcodeNumber;
                document.getElementById('initialAmount').value = card.initialAmount;
                document.getElementById('remainingAmount').value = card.remainingAmount;
                document.getElementById('expiryDate').value = card.expiryDate || '';
                cardModal.show();
            }
        }

        function showBarcodeModal(id) {
            const card = cards.find(c => c.id === id);
            if (!card) return;
            currentDeductingId = id;
            document.getElementById('barcodeCardInfo').innerText = `${card.storeName} - ${card.cardTitleName} (剩餘: $${card.remainingAmount})`;
            document.getElementById('barcodeTextDisplay').innerText = card.barcodeNumber;
            document.getElementById('quickDeductAmount').value = '';
            document.getElementById('calcPreviewBox').style.display = 'none';
            
            try {
                JsBarcode("#barcodeSvg", card.barcodeNumber, { format: "CODE128", width: 2, height: 70, displayValue: false });
            } catch (e) { console.error(e); }
            barcodeModal.show();
        }

        function previewAutoCalc(el) {
            const card = cards.find(c => c.id === currentDeductingId);
            if (!card) return;
            const val = Number(el.value);
            const box = document.getElementById('calcPreviewBox');
            if (!el.value || val <= 0) { box.style.display = 'none'; return; }
            let rem = Math.max(0, card.remainingAmount - val);
            document.getElementById('previewRemaining').innerText = `$${rem.toLocaleString()}`;
            box.style.display = 'block';
        }

        function confirmDeduct() {
            const val = Number(document.getElementById('quickDeductAmount').value);
            const card = cards.find(c => c.id === currentDeductingId);
            if (!val || val <= 0) { alert('請輸入有效金額'); return; }
            if (val > card.remainingAmount && !confirm('扣款金額大於剩餘金額，確定歸零嗎？')) return;

            cards = cards.map(c => c.id === currentDeductingId ? { ...c, remainingAmount: Math.max(0, c.remainingAmount - val) } : c);
            localStorage.setItem('convenience_store_cards_v3', JSON.stringify(cards));
            barcodeModal.hide();
            renderCards();
            alert('扣款成功！');
        }

        function saveCard(e) {
            e.preventDefault();
            stopScanner();
            const id = document.getElementById('cardId').value;
            const data = {
                storeName: document.getElementById('storeName').value,
                cardTitleName: document.getElementById('cardTitleName').value,
                barcodeNumber: document.getElementById('barcodeNumber').value,
                initialAmount: Number(document.getElementById('initialAmount').value),
                remainingAmount: Number(document.getElementById('remainingAmount').value),
                expiryDate: document.getElementById('expiryDate').value
            };

            if (id) {
                cards = cards.map(c => c.id == id ? { ...c, ...data } : c);
            } else {
                cards.push({ id: Date.now(), ...data });
            }

            localStorage.setItem('convenience_store_cards_v3', JSON.stringify(cards));
            cardModal.hide();
            renderCards();
        }

        function deleteCard(id) {
            if (confirm('確定要刪除嗎？')) {
                cards = cards.filter(c => c.id !== id);
                localStorage.setItem('convenience_store_cards_v3', JSON.stringify(cards));
                renderCards();
            }
        }

        function renderCards() {
            const tbody = document.getElementById('cardTableBody');
            const filter = document.getElementById('filterStore').value;
            tbody.innerHTML = '';
            let totalInit = 0, totalRem = 0;

            const list = cards.filter(c => !filter || c.storeName === filter);
            if (!list.length) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-muted py-4">目前沒有商品卡資料。</td></tr>`;
            }

            list.forEach(card => {
                totalInit += Number(card.initialAmount);
                totalRem += Number(card.remainingAmount);
                const isDepleted = Number(card.remainingAmount) <= 0;
                let status = '<span class="badge bg-success">正常</span>';
                if (isDepleted) status = '<span class="badge bg-dark">用畢</span>';
                else if (card.expiryDate && new Date(card.expiryDate) < new Date()) status = '<span class="badge bg-danger">過期</span>';

                const tr = document.createElement('tr');
                if (isDepleted) tr.classList.add('card-depleted');
                tr.innerHTML = `
                    <td>${getStoreBadge(card.storeName)}</td>
                    <td class="text-start ps-3">
                        <div class="fw-bold">${card.cardTitleName}</div>
                        <small class="text-muted font-monospace">${card.barcodeNumber}</small>
                    </td>
                    <td>$${Number(card.initialAmount).toLocaleString()}</td>
                    <td class="fw-bold text-success">$${Number(card.remainingAmount).toLocaleString()}</td>
                    <td>${card.expiryDate || '無期限'}</td>
                    <td>${status}</td>
                    <td>
                        <button class="btn btn-sm btn-warning text-dark me-1" onclick="showBarcodeModal(${card.id})" ${isDepleted ? 'disabled' : ''}><i class="bi bi-upc-scan"></i> 結帳</button>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${card.id})"><i class="bi bi-pencil-square"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteCard(${card.id})"><i class="bi bi-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalInitial').innerText = `$${totalInit.toLocaleString()}`;
            document.getElementById('totalRemaining').innerText = `$${totalRem.toLocaleString()}`;
            document.getElementById('totalUsed').innerText = `$${(totalInit - totalRem).toLocaleString()}`;
        }

        renderCards();
    </script>
</body>
</html>
